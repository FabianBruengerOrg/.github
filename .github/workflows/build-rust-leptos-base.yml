name: Build Rust Leptos Base Image

# Builds and publishes the shared Rust/Leptos build toolchain image used by
# app Dockerfiles' `FROM` stage (see docker/rust-leptos-base/Dockerfile).
# Bumping cargo-leptos/cargo-chef/Node versions here means app repos no
# longer reinstall them on every single build.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docker/rust-leptos-base/Dockerfile"
      - ".github/workflows/build-rust-leptos-base.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/fabianbruengerorg/rust-leptos-base

jobs:
  build-and-push:
    name: Build rust${{ matrix.rust-version }} variant
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rust-version: "1.98"
            is-default: true
          - rust-version: "1.90"
            is-default: false
    env:
      CARGO_LEPTOS_VERSION: "0.3.2"
      CARGO_CHEF_VERSION: "0.1.73"
      NODE_MAJOR: "24"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: tags
        run: |
          VERSION_TAG="rust${{ matrix.rust-version }}-leptos${CARGO_LEPTOS_VERSION}"
          FLOATING_TAG="rust${{ matrix.rust-version }}"
          TAGS="${IMAGE_NAME}:${VERSION_TAG},${IMAGE_NAME}:${FLOATING_TAG}"
          if [ "${{ matrix.is-default }}" = "true" ]; then
            TAGS="${TAGS},${IMAGE_NAME}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push base image
        uses: docker/build-push-action@v7
        with:
          context: docker/rust-leptos-base
          file: docker/rust-leptos-base/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            RUST_VERSION=${{ matrix.rust-version }}
            NODE_MAJOR=${{ env.NODE_MAJOR }}
            CARGO_LEPTOS_VERSION=${{ env.CARGO_LEPTOS_VERSION }}
            CARGO_CHEF_VERSION=${{ env.CARGO_CHEF_VERSION }}
          cache-from: type=gha,scope=rust-leptos-base-${{ matrix.rust-version }}
          cache-to: type=gha,scope=rust-leptos-base-${{ matrix.rust-version }},mode=max
          platforms: linux/amd64
