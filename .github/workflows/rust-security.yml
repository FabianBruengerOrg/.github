name: Rust Security Scan (reusable)

# Shared security workflow for all FabianBruengerOrg Rust/Leptos apps.
# Called via `uses: FabianBruengerOrg/.github/.github/workflows/rust-security.yml@main`

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Path to the Cargo project (relative to repo root)"
        type: string
        default: "."
      strict-lints:
        description: "Deny unwrap()/expect()/panic!() via clippy"
        type: boolean
        default: false
      check-unsafe-patterns:
        description: "Grep-based check for unwrap/expect/panic in src/"
        type: boolean
        default: false
      check-sql-injection:
        description: "Grep-based check for string-built SQL"
        type: boolean
        default: false
      cargo-audit-fail-on-warnings:
        description: "Fail the job if cargo-audit reports warnings (not just vulnerabilities)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  cargo-audit:
    name: Cargo Audit - Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles(format('{0}/**/Cargo.lock', inputs.working-directory)) }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ "${{ inputs.cargo-audit-fail-on-warnings }}" = "true" ]; then
            cargo audit --deny warnings
          else
            cargo audit
          fi

  security-lints:
    name: Security-Focused Clippy Lints
    runs-on: ubuntu-latest
    if: inputs.strict-lints
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ inputs.working-directory }}/target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles(format('{0}/**/Cargo.lock', inputs.working-directory)) }}

      - name: Run security clippy checks
        working-directory: ${{ inputs.working-directory }}
        run: |
          cargo clippy --all-targets --all-features -- \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -W clippy::todo \
            -W clippy::unimplemented \
            -W clippy::dbg_macro

  secret-scanning:
    name: Secret Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ${{ inputs.working-directory }}
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0

  semgrep:
    name: Semgrep Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/rust
            p/security-audit
            p/owasp-top-ten

  check-unsafe-patterns:
    name: Check for Unsafe Patterns
    runs-on: ubuntu-latest
    if: inputs.check-unsafe-patterns
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check for unwrap/expect/panic in production code
        working-directory: ${{ inputs.working-directory }}
        run: |
          fail=0
          if grep -rn "\.unwrap()" src --include="*.rs" --exclude-dir=tests 2>/dev/null; then
            echo "::error::Found .unwrap() in production code"
            fail=1
          fi
          if grep -rn "\.expect(" src --include="*.rs" --exclude-dir=tests 2>/dev/null; then
            echo "::error::Found .expect() in production code"
            fail=1
          fi
          if grep -rn "panic!" src --include="*.rs" --exclude-dir=tests 2>/dev/null; then
            echo "::error::Found panic!() in production code"
            fail=1
          fi
          exit $fail

  check-sql-injection:
    name: SQL Injection Pattern Check
    runs-on: ubuntu-latest
    if: inputs.check-sql-injection
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check for SQL string concatenation
        working-directory: ${{ inputs.working-directory }}
        run: |
          fail=0
          if grep -rnE 'format!\s*\(\s*"(SELECT|INSERT|UPDATE|DELETE|DROP)' src --include="*.rs" 2>/dev/null; then
            echo "::error::Potential SQL injection via format!"
            fail=1
          fi
          if grep -rnE '\+\s*"(SELECT|INSERT|UPDATE|DELETE|DROP)' src --include="*.rs" 2>/dev/null; then
            echo "::error::Potential SQL injection via string concatenation"
            fail=1
          fi
          exit $fail

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs:
      [
        cargo-audit,
        security-lints,
        secret-scanning,
        semgrep,
        check-unsafe-patterns,
        check-sql-injection,
      ]
    if: always()
    steps:
      - name: Generate security report
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Cargo Audit | ${{ needs.cargo-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Lints | ${{ needs.security-lints.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scanning | ${{ needs.secret-scanning.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep | ${{ needs.semgrep.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unsafe Pattern Check | ${{ needs.check-unsafe-patterns.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SQL Injection Check | ${{ needs.check-sql-injection.result }} |" >> $GITHUB_STEP_SUMMARY
